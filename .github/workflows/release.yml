name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          if ($version -notmatch '^\d+\.\d+\.\d+$')
          {
            throw "Release tags must use the format vMajor.Minor.Patch."
          }

          $assemblyVersion = "$version.0"
          "version=$version" >> $env:GITHUB_OUTPUT
          "assembly_version=$assemblyVersion" >> $env:GITHUB_OUTPUT

      - name: Restore
        run: dotnet restore .\tests\Sreapeat.Tests\Sreapeat.Tests.csproj

      - name: Build app
        run: >
          dotnet build .\sreapeat.csproj -c Release --no-restore
          -p:Version=${{ steps.version.outputs.version }}
          -p:AssemblyVersion=${{ steps.version.outputs.assembly_version }}
          -p:FileVersion=${{ steps.version.outputs.assembly_version }}
          -p:InformationalVersion=${{ github.ref_name }}

      - name: Run tests
        run: dotnet test .\tests\Sreapeat.Tests\Sreapeat.Tests.csproj -c Release --no-restore

      - name: Publish win-x64 package
        run: >
          dotnet publish .\sreapeat.csproj -c Release -r win-x64 --self-contained false --no-build
          --output .\artifacts\publish\win-x64
          -p:Version=${{ steps.version.outputs.version }}
          -p:AssemblyVersion=${{ steps.version.outputs.assembly_version }}
          -p:FileVersion=${{ steps.version.outputs.assembly_version }}
          -p:InformationalVersion=${{ github.ref_name }}

      - name: Create release archive
        id: package
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          $packageDir = Join-Path $PWD "artifacts\package"
          $zipPath = Join-Path $packageDir "sreapeat-$version-win-x64.zip"
          $hashPath = "$zipPath.sha256"

          New-Item -ItemType Directory -Force -Path $packageDir | Out-Null
          Compress-Archive -Path .\artifacts\publish\win-x64\* -DestinationPath $zipPath -Force

          $hash = (Get-FileHash $zipPath -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -Path $hashPath -Value "$hash *$(Split-Path $zipPath -Leaf)"

          "zip_path=$zipPath" >> $env:GITHUB_OUTPUT
          "hash_path=$hashPath" >> $env:GITHUB_OUTPUT

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            ${{ steps.package.outputs.zip_path }}
            ${{ steps.package.outputs.hash_path }}
